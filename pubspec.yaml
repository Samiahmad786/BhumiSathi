name: bhumi_saathi
description: Bhumi Saathi - unified land-services helper for India.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  decimal: ^3.0.2
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/config/
